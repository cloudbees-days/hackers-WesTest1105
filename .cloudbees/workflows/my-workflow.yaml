apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Say Hello
on:
  workflow_dispatch:
    inputs:
      Name:
        type: string
        default: Spike W
jobs:
  build:
    steps:
      - name: Say hello
        run: |
          echo "hello $[[inputs.Name]]"
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
