apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: HelloSpike
on:
  workflow_dispatch:
    inputs:
      Name:
        type: string
        default: Hello Spike
jobs:
  build:
    steps:
      - id: n8n
        name: Run n8n workflow
        uses: docker://n8nio/n8n:latest
        with:
          entrypoint: n8n
          args: |
            execute \
            --file \
            ${{ cloudbees.workspace }}/workflow.json
